services:
  - type: web
    name: cantinho-das-cores-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://cantinho-das-cores.vercel.app,https://ca10v1ana.github.io
      - key: DATABASE_PATH
        value: /var/data/cantinho_das_cores.sqlite3
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: REPORT_DELIVERY_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: onboarding@resend.dev
    disk:
      name: cantinho-sqlite-disk
      mountPath: /var/data
      sizeGB: 1
